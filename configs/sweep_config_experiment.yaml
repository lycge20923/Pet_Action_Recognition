program: train.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  exec_name: # change to easily identify
    values: ["experiment_flow_A_multiple_dims"]
  fold_num:
    values: [0]
  # ... other parameters
  epochs:
    values: [10000]
  batch_size:
    values: [32]
  add_I3D_branch:
    values: [False]
  gcn_model_name:
    values: ["degcn"]
  scheduler_eta_min:
    values: [0.0001]
  degcn_add_of_A:
    values: [True]
  # degcn_add_node_attention:
  #   values: [True]