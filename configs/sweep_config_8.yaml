program: train.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  # can only adjust, but can't delete
  exec_name: # change to easily identify
    values: ["stgcn&I3D_Best"]
  fold_num:
    values: [0]
  # ... other parameters
  epochs:
    values: [200]
  scheduler_eta_min:
    values: [1e-5]
  patient_epochs:
    values: [100]
  use_multiplie_learning_rates:
    values: [True]
  learning_rate:
    values: [1e-4]
  late_fusion_use_mlp:
    values: [True]