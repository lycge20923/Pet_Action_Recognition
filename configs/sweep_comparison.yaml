program: train.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  fold_num:
    values: [0]
  exec_name: # change to easily identify
    values: ["comparison: joints flow(KABR)"]
  epochs:
    values: [2000]
  patient_epochs:
    values: [500]
  batch_size:
    values: [32]
  # other parameters...
  data_dir:
    values: ["data/others/KABR"]
  actions:
    values: [["Walk", "Graze", "Browse", "Head Up", "Auto-Groom", "Trot", "Run", "Occluded"]]
  num_classes:
    values: [8]