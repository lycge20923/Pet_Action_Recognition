program: train.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  fold_num:
    values: [0, 1, 2, 3, 4]
  exec_name: # change to easily identify
    values: ["compare: gcns"]
  epochs:
    values: [2000]
  patient_epochs:
    values: [500]
  batch_size:
    values: [32]
  # other parameters...
  gcn_model_name:
    values: ["stgcn", "tdgcn", "degcn", "infogcn", "ctrgcn"]