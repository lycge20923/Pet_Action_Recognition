program: train.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  fold_num:
    values: [0, 1, 2, 3, 4]
  exec_name: # change to easily identify
    values: ["formal:gcn"]
  epochs:
    values: [3000]
  batch_size:
    values: [32]
  add_I3D_branch:
    values: [False]
  add_flow_adjacency:
    values: [False]
  add_flow_coords:
    values: [False]
  gcn_model_name:
    values: ["stgcn", "tdgcn", "degcn"]
  # other parameters...