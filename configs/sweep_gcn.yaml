program: train.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  fold_num:
    values: [0, 1, 2, 3, 4]
  exec_name: # change to easily identify
    values: ["compare: gcns(include diff)"]
  epochs:
    values: [2000]
  batch_size:
    values: [32]
  add_I3D_branch:
    values: [False]
  # other parameters...
  add_flow_stream:
    values: [False]
  use_frame_diff:
    values: [True]
  gcn_model_name:
    values: ["stgcn", "tdgcn", "degcn", "infogcn", "ctrgcn"]