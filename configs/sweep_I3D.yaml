program: train.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  fold_num:
    values: [0, 1, 2, 3, 4]
  exec_name: # change to easily identify
    values: ["formal:only I3D"]
  is_I3D_stream:
    values: [True]
  # other parameters...
  load_i3d_weights:
    values: [True]
  I3D_mode:
    values: ["flow", "rgb"]