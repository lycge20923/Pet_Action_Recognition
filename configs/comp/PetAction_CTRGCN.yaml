base_lr: 0.0001
batch_size: 32
test_batch_size: 64
num_epoch: 1000
weights: null
nesterov: True
save_interval: 10
save_epoch: 10
eval_interval: 10
seed: 42
patient_epochs: 500

# ===== Dataset ===== #
feeder: comparison.CTRGCN.feeders.feeder_PetAction.Feeder
train_feeder_args:
  split: train
  data_path: ./data/main/comp_data/data_fold_1.npz # modify
  window_size: 32
  debug: False
  p_interval: [0.5, 1]
  bone: True # modify
  vel: True # modify
test_feeder_args:
  data_path: ./data/main/comp_data/data_fold_1.npz # modify
  split: test
  window_size: 32
  p_interval: [0.95]
  bone: True # modify
  vel: True # modify

# ===== Model ===== #
model: comparison.CTRGCN.model.ctrgcn.Model
model_args:
  num_class: 11
  num_point: 17
  num_person: 1
  graph: comparison.graph.AP10K.Graph
  graph_args:
    labeling_mode: 'spatial'

