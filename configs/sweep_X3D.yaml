program: train.py
method: grid
metric:
  name: best_val_acc
  goal: maximize
parameters:
  fold_num:
    values: [0, 1, 2, 3, 4]
  exec_name: # change to easily identify
    values: ["formal:X3D stream"]
  is_X3D_stream:
    values: [True]
  epochs:
    values: [500]
  batch_size:
    values: [8]
  